# Temporary bootstrap config for initial Certbot SSL issuance.
# init-ssl.sh copies this over the template, starts nginx, runs certbot,
# then restores the full template.
server {
    listen 80;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "Rina SSL initialization in progress...\n";
    }
}
