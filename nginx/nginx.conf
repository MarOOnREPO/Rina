user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# ═══════════════════════════════════════════════════════════════
# STREAM LAYER — SNI Multiplexing on Port 443
# ═══════════════════════════════════════════════════════════════
# ssl_preread inspects the SNI from the ClientHello WITHOUT
# terminating TLS. This makes the traffic indistinguishable from
# standard HTTPS, bypassing DPI fingerprinting.
# ═══════════════════════════════════════════════════════════════
stream {
    # Docker embedded DNS resolver (required for upstream hostnames)
    resolver 127.0.0.11 valid=30s;

    map $ssl_preread_server_name $backend {
        rina.devopsya.com   127.0.0.1:8443;
        turn.devopsya.com   127.0.0.1:9443;
        default             127.0.0.1:8443;
    }

    # Public edge listener — all TCP/443 traffic enters here
    server {
        listen 443;
        proxy_pass $backend;
        ssl_preread on;
        proxy_protocol on;
        proxy_connect_timeout 2s;
        proxy_timeout 10m;
    }

    # Intermediate proxy for Coturn:
    # Consumes the PROXY protocol header so Coturn receives a clean
    # TLS stream. Coturn terminates TLS itself using its own certs.
    server {
        listen 127.0.0.1:9443 proxy_protocol;
        proxy_pass coturn:5349;
        proxy_connect_timeout 2s;
        proxy_timeout 10m;
    }
}

# ═══════════════════════════════════════════════════════════════
# HTTP LAYER — Web Application (accessed internally via Stream)
# ═══════════════════════════════════════════════════════════════
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    include /etc/nginx/conf.d/*.conf;
}
