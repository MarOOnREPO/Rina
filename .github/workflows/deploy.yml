name: Deploy Rina

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    environment:
      name: production
      url: https://${{ secrets.REMOTE_HOST }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: '1.25'
          cache-dependency-path: go-backend/go.sum

      - name: Lint & Type Check Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run lint
          npm run check

      - name: npm audit Frontend
        working-directory: ./frontend
        run: npm audit --audit-level=moderate

      - name: Build & Test Backend
        working-directory: ./backend
        run: |
          npm ci
          npm run db:generate
          npm run build

      - name: npm audit Backend
        working-directory: ./backend
        run: npm audit --audit-level=moderate

      - name: Build Go Backend
        working-directory: ./go-backend
        run: go build ./cmd/server

      - name: Test Go Backend
        working-directory: ./go-backend
        run: go test ./...

      - name: Build Frontend for Production
        working-directory: ./frontend
        env:
          VITE_MAPBOX_TOKEN: ${{ secrets.VITE_MAPBOX_TOKEN }}
        run: npm run build

      - name: Run Playwright E2E Tests
        working-directory: ./frontend
        run: |
          npx playwright install chromium
          npx playwright test

      - name: Scan go-backend filesystem with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: 'fs'
          scan-ref: './go-backend'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Scan nginx image with Trivy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: 'image'
          image-ref: 'nginx:1.27-alpine'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Check deploy secrets
        id: deploy-check
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          HOST: ${{ secrets.REMOTE_HOST }}
          USER: ${{ secrets.REMOTE_USER }}
        run: |
          if [ -n "$SSH_KEY" ] && [ -n "$HOST" ] && [ -n "$USER" ]; then
            echo "has_secrets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_secrets=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ Deploy secrets not configured. Skipping deployment."
          fi

      - name: Deploy to Server (rsync)
        if: github.ref == 'refs/heads/main' && steps.deploy-check.outputs.has_secrets == 'true'
        uses: easingthemes/ssh-deploy@2cc5b27bf3029d0455dd5e09fe02633904031447
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
          REMOTE_USER: ${{ secrets.REMOTE_USER }}
          SOURCE: './'
          TARGET: '/home/ubuntu/rina'
          EXCLUDE: 'backend/node_modules,frontend/node_modules,frontend/.svelte-kit,backend/dist,go-backend/server,go-backend/migrate,.git,.env'

      - name: Restart services via SSH
        if: github.ref == 'refs/heads/main' && steps.deploy-check.outputs.has_secrets == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/rina
            ./scripts/deploy.sh

      - name: Post-deploy Health Check
        if: github.ref == 'refs/heads/main' && steps.deploy-check.outputs.has_secrets == 'true'
        run: |
          sleep 10
          curl -sf "https://${{ secrets.REMOTE_HOST }}/api/health" || (echo "❌ Health check failed" && exit 1)

      - name: Post-deploy WebSocket Auth Check
        if: github.ref == 'refs/heads/main' && steps.deploy-check.outputs.has_secrets == 'true'
        run: |
          sleep 2
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${{ secrets.REMOTE_HOST }}/ws")
          if [ "$STATUS" != "401" ]; then
            echo "❌ WebSocket endpoint did not return 401 (got $STATUS)"
            exit 1
          fi
          echo "✅ WebSocket endpoint correctly requires auth (401)"
