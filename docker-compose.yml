  #     - "5349:5349"
  #     - "5349:5349/udp"
  #     - "49152-65535:49152-65535/udp"
  #   environment:
  #     - DETECT_EXTERNAL_IP=yes
  #     - DETECT_RELAY_IP=yes
  #   command: >
  #     -n --log-file=stdout
  #     --listening-port=3478
  #     --tls-listening-port=5349
  #     --realm=${COTURN_REALM:-localhost}
  #     --server-name=rina-coturn
  #     --fingerprint
  #     --lt-cred-mech
  #     --user=maroon:${COTURN_SECRET:-rina2026}
  #     --user=rina:${COTURN_SECRET:-rina2026}
  #     --no-cli
  #     --min-port=49152
  #     --max-port=65535
  #   networks:
  #     - rina-network
  #   restart: unless-stopped

  # certbot:
  #   image: certbot/certbot
  #   container_name: rina-certbot
  #   volumes:
  #     - certbot-data:/etc/letsencrypt
  #     - certbot-www:/var/www/certbot
  #   entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
  #   networks:
