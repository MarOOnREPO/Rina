version: '3.8'

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: rina-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - certbot-data:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      coturn:
        condition: service_started
    networks:
      - rina-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://backend:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rina-backend
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATABASE_URL=postgresql://rina_user:${POSTGRES_PASSWORD}@postgres:5432/rina_db
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - REDIS_URL=redis://redis:6379
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - COTURN_REALM=turn.devopsya.com
      - COTURN_SECRET=${COTURN_SECRET}
      - MAROON_PASSWORD_HASH=${MAROON_PASSWORD_HASH}
      - RINA_PASSWORD_HASH=${RINA_PASSWORD_HASH}
      - AWS_REGION=${AWS_REGION:-eu-central-1}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-rina-movies-storage}
      - TMDB_API_KEY=${TMDB_API_KEY}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rina-network
      - rina-data
    restart: unless-stopped
    init: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  coturn:
    build:
      context: ./coturn
      dockerfile: Dockerfile
    container_name: rina-coturn
    environment:
      - EXTERNAL_IP=${EXTERNAL_IP:-}
      - COTURN_SECRET=${COTURN_SECRET}
    volumes:
      - certbot-data:/etc/letsencrypt:ro
    expose:
      - "5349"
    networks:
      - rina-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "test -f /var/tmp/turnserver.pid && kill -0 $$(cat /var/tmp/turnserver.pid) || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:16.3-alpine
    container_name: rina-postgres
    environment:
      - POSTGRES_USER=rina_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=rina_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rina-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rina_user -d rina_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  redis:
    image: redis:7.2-alpine
    container_name: rina-redis
    volumes:
      - redis_data:/data
    networks:
      - rina-data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  certbot:
    image: certbot/certbot:v2.11.0
    container_name: rina-certbot
    volumes:
      - certbot-data:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - rina-network
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  postgres_data:
  redis_data:
  certbot-data:
  certbot-www:

networks:
  rina-network:
    driver: bridge
  rina-data:
    driver: bridge
    internal: true
