version: '3.8'

services:
  nginx:
    image: nginx:alpine
    container_name: rina-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
      - certbot-data:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend
    networks:
      - rina-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rina-backend
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://rina_user:${POSTGRES_PASSWORD}@postgres:5432/rina_db
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECRET=${COOKIE_SECRET}
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=${MINIO_USE_SSL:-false}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-rina-uploads}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - COTURN_REALM=${COTURN_REALM}
      - COTURN_SECRET=${COTURN_SECRET}
    # Backend is NOT exposed to host; only accessible via nginx reverse proxy
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - rina-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: rina-postgres
    environment:
      - POSTGRES_USER=rina_user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=rina_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rina-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rina_user -d rina_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: rina-redis
    volumes:
      - redis_data:/data
    networks:
      - rina-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-05-01T01-11-10Z
    container_name: rina-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    # MinIO is NOT exposed to host; only accessible via internal Docker network
    expose:
      - "9000"
      - "9001"
    networks:
      - rina-network
    restart: unless-stopped
    # MinIO scratch-based image has no curl/wget; rely on service_started dependency instead

  # ─── Coturn (TURN Server for WebRTC) ────────────────────────────
  # In production on AWS Lightsail, run Coturn on a dedicated instance
  # with public IP and open UDP ports. Uncomment below for local testing.
  # coturn:
  #   image: coturn/coturn:latest
  #   container_name: rina-coturn
  #   ports:
  #     - "3478:3478"
