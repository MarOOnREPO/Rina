version: "2"
sql:
  - schema: "migrations/001_baseline.up.sql"
    queries: "queries/queries.sql"
    engine: "postgresql"
    gen:
      go:
        out: "internal/db"
        package: "db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "event_type"
            go_type:
              type: "EventType"
          - db_type: "message_type"
            go_type:
              type: "MessageType"
